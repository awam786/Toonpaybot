<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>ToonPay</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="page" style="padding-bottom: 120px;">
  <div class="dash-top">
    <div class="dash-logo">T</div>
    <div class="rewards-pill">🎁 REWARDS</div>
    <div class="bell">🔔</div>
  </div>

  <div class="balance-label">TOTAL BALANCE</div>
  <div class="balance-amount">$-0.66</div>

  <div class="actions">
    <div class="action"><div class="ico">⬇</div><div class="lbl">Receive</div></div>
    <div class="action"><div class="ico">💳</div><div class="lbl">Details</div></div>
    <div class="action"><div class="ico">➤</div><div class="lbl">Send</div></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-icon">🎁</div>
      <div class="card-title">Cashback Balance</div>
      <div class="progress"><span style="width:0%"></span></div>
      <div class="progress-row"><span>Points Earned</span><span>0 / 100</span></div>
    </div>
    <div class="card">
      <div class="card-icon">💳</div>
      <div class="plan-text">Plan expires on <b>Feb 12.</b><br />Extend to keep perks.</div>
      <div class="plan-link">Manage Plan ›</div>
    </div>
  </div>

  <div class="row-link">Transactions <span>›</span></div>

  <div class="bottom-nav">
    <div class="nav-item active"><span class="ico">🏠</span>Home</div>
    <div class="nav-item"><span class="ico">💎</span>Plans</div>
    <div class="nav-item"><span class="ico">👥</span>Referrals</div>
    <div class="nav-item"><span class="ico">⚙</span>Settings</div>
  </div>
</div>
</body>
</html>
