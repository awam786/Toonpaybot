<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Enter Code · ToonPay</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="page">
  <div class="topbar">
    <span class="icon" onclick="history.back()">←</span>
    <span class="title">ToonPay</span>
    <span class="icon">⋮</span>
  </div>

  <h1>Enter 6-digit Code</h1>
  <p class="subtitle">
    Code has been sent to <span id="identShow" style="color:#fff;font-weight:600;">…</span>.
    Please enter it below to continue.
  </p>

  <div class="otp-row" id="otpRow">
    <input class="otp-box" inputmode="numeric" maxlength="1" />
    <input class="otp-box" inputmode="numeric" maxlength="1" />
    <input class="otp-box" inputmode="numeric" maxlength="1" />
    <div class="otp-gap"></div>
    <input class="otp-box" inputmode="numeric" maxlength="1" />
    <input class="otp-box" inputmode="numeric" maxlength="1" />
    <input class="otp-box" inputmode="numeric" maxlength="1" />
  </div>

  <div id="status" class="status">
    <span class="spinner"></span>Waiting for admin to send you the code…
  </div>
</div>

<script src="/static/app.js"></script>
<script>initOtpPage();</script>
</body>
</html>
