<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>ToonPay</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="page">
  <div class="topbar">
    <span class="icon">✕</span>
    <span class="title">ToonPay</span>
    <span class="icon">⋮</span>
  </div>

  <h1>Welcome Back to ToonPay</h1>
  <p class="subtitle">Enter your phone number to continue. We'll send a verification code.</p>

  <input id="phone" class="input" type="tel" placeholder="e.g. +1234567890" autocomplete="off" />
  <a class="link-blue" href="#" id="noAccount">Don't have an account yet?</a>

  <button class="btn-primary" id="sendCodeBtn">Send Code</button>

  <div class="divider">or</div>

  <button class="btn-secondary" id="emailBtn">
    <span>✉️</span> Continue with E-mail
  </button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
